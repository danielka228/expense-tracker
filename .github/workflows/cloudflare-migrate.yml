# Деплой на Cloudflare: сам после мержа в main или вручную: GitHub → Actions → «Переезд на Cloudflare» → Run workflow.
# target=preview выкладывает отдельную демо-версию expense-tracker-preview со своей базой — основной сайт не трогается.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (и DATABASE_URL — только для переноса данных).
# Необязательный TELEGRAM_BOT_TOKEN (токен от @BotFather) включает Telegram-бота на основном сайте,
# а TELEGRAM_ADMIN_ID (свой ID узнаётся командой /myid у бота) — админ-панель /admin только для владельца.
name: Переезд на Cloudflare

on:
  # Сайт обновляется сам после каждого мержа в main, если менялся код сайта
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда выкладывать: production — основной сайт, preview — демо-версия'
        type: choice
        options: [production, preview]
        default: production
      import_data:
        description: 'Перенести данные из старой базы (только production и только если в D1 ещё пусто)'
        type: boolean
        default: false

concurrency: cloudflare-${{ inputs.target || 'production' }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Окружение
        run: |
          if [ "$TARGET" = "preview" ]; then
            { echo "DB_NAME=expense-tracker-preview"; echo "WORKER=expense-tracker-preview"; echo "ENV_ARGS=--env preview"; echo "PLACEHOLDER=11111111-1111-1111-1111-111111111111"; } >> "$GITHUB_ENV"
          else
            { echo "DB_NAME=expense-tracker"; echo "WORKER=expense-tracker"; echo "ENV_ARGS=--env="; echo "PLACEHOLDER=00000000-0000-0000-0000-000000000000"; } >> "$GITHUB_ENV"
          fi
          echo "Выкладываю: $TARGET"

      - name: Проверка секретов
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ "${{ inputs.import_data }}" = "true" ] && [ "$TARGET" = "production" ] && [ -z "$DATABASE_URL" ]; then missing="$missing DATABASE_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Проверка токена Cloudflare
        run: |
          # Чистим токен от того, что легко скопировать вместе с ним: пробелы, переносы строк,
          # кавычки, слово «Bearer» или целиком тестовую команду curl со страницы Cloudflare
          t=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          case "$t" in *Bearer\ *) t=${t##*Bearer }; t=${t%%[\"\' ]*} ;; esac
          t=$(printf '%s' "$t" | tr -d " \t\"'")
          a=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d " \t\r\n\"'")
          a=${a#*dash.cloudflare.com/}; a=${a%%/*}
          echo "::add-mask::$t"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$a" >> "$GITHUB_ENV"
          echo "Длина токена: ${#t}, длина Account ID: ${#a}"
          [ ${#a} -eq 32 ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID должен быть 32 символа, сейчас ${#a}"; exit 1; }
          res=$(curl -sS -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$a/tokens/verify")
          if [ "$(echo "$res" | jq -r '.success')" != "true" ]; then
            res=$(curl -sS -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          fi
          echo "$res" | jq '{success, status: .result.status, errors}'
          [ "$(echo "$res" | jq -r '.success')" = "true" ] || { echo "::error::Cloudflare не принял токен. Создай новый токен и заново сохрани его в секрет CLOUDFLARE_API_TOKEN (только сам токен, без пробелов и без слова Bearer)."; exit 1; }

      - name: Адрес workers.dev
        id: subdomain
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            want="spendtracker-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8)"
            echo "Регистрирую поддомен $want.workers.dev"
            curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$want\"}" "$api" | jq '{success, errors}'
            sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          fi
          [ -n "$sub" ] || { echo "::error::Не удалось получить поддомен workers.dev. Открой в Cloudflare раздел Workers & Pages один раз и запусти снова."; exit 1; }
          echo "url=https://$WORKER.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      - name: База D1
        run: |
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME"
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::Не удалось создать базу D1"; exit 1; }
          echo "D1 database_id: $id"
          sed -i "s/$PLACEHOLDER/$id/" wrangler.jsonc
          npx wrangler d1 migrations apply "$DB_NAME" --remote $ENV_ARGS

      - name: Деплой сайта
        run: |
          npx wrangler deploy $ENV_ARGS
          if ! npx wrangler secret list $ENV_ARGS --format json | jq -e '.[] | select(.name == "SECRET_KEY")' > /dev/null; then
            echo "Создаю SECRET_KEY"
            openssl rand -hex 32 | npx wrangler secret put SECRET_KEY $ENV_ARGS
          fi

      - name: Telegram-бот
        if: env.TARGET == 'production'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          t=$(printf '%s' "$TG_TOKEN" | tr -d " \t\r\n\"'")
          if [ -z "$t" ]; then
            echo "Секрет TELEGRAM_BOT_TOKEN не задан — бот не подключается."
            exit 0
          fi
          echo "::add-mask::$t"
          api="https://api.telegram.org/bot$t"
          me=$(curl -sS "$api/getMe")
          [ "$(echo "$me" | jq -r '.ok')" = "true" ] || { echo "::error::Telegram не принял токен. В секрете TELEGRAM_BOT_TOKEN должен быть только токен от @BotFather, вида 123456789:AAE…"; exit 1; }
          bot=$(echo "$me" | jq -r '.result.username')
          printf '%s' "$t" | npx wrangler secret put TELEGRAM_BOT_TOKEN $ENV_ARGS
          # Тот же секрет Worker считает у себя (webhookSecret в src/telegram.ts) и сверяет с заголовком запроса
          secret=$(printf '%s' "$t" | sha256sum | cut -c1-48)
          hook="${{ steps.subdomain.outputs.url }}/tg/webhook"
          curl -sS "$api/setWebhook" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$hook" --arg s "$secret" '{url: $u, secret_token: $s, allowed_updates: ["message", "callback_query", "inline_query", "chosen_inline_result", "guest_message"]}')" | jq -c '{ok, description}'
          curl -sS "$api/setMyCommands" -H 'Content-Type: application/json' --data '{"commands": [
            {"command": "menu", "description": "Меню"},
            {"command": "stats", "description": "Статистика"},
            {"command": "last", "description": "Мои траты"},
            {"command": "undo", "description": "Удалить последнюю запись"},
            {"command": "stickers", "description": "Стикеры Трэка"},
            {"command": "help", "description": "Как пользоваться"}]}' | jq -c '{ok}'
          # Кнопка слева от поля ввода открывает сайт прямо в Telegram (Mini App) — сразу в аккаунте
          app="${{ steps.subdomain.outputs.url }}/tg/app"
          curl -sS "$api/setChatMenuButton" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg u "$app" '{menu_button: {type: "web_app", text: "СпендТрекер", web_app: {url: $u}}}')" | jq -c '{ok, description}'
          curl -sS "$api/setMyDescription" -H 'Content-Type: application/json' \
            --data '{"description": "Записываю траты в СпендТрекер. Напиши «кофе 250» — и трата уже на сайте."}' | jq -c '{ok}'
          # Админ-панель: ID владельца — в секрет Worker, а /admin — в меню команд только его чата
          admin=$(printf '%s' "$TG_ADMIN" | tr -cd '0-9')
          if [ -n "$admin" ]; then
            printf '%s' "$admin" | npx wrangler secret put TELEGRAM_ADMIN_ID $ENV_ARGS
            curl -sS "$api/setMyCommands" -H 'Content-Type: application/json' --data "$(jq -nc --argjson id "$admin" '{scope: {type: "chat", chat_id: $id}, commands: [
              {command: "menu", description: "Меню"}, {command: "admin", description: "Админ-панель"},
              {command: "stats", description: "Статистика"}, {command: "last", description: "Мои траты"},
              {command: "undo", description: "Удалить последнюю запись"}, {command: "stickers", description: "Стикеры Трэка"},
              {command: "help", description: "Как пользоваться"}]}')" | jq -c '{ok, description}'
          else
            echo "Секрет TELEGRAM_ADMIN_ID не задан — админ-панель выключена. Узнай свой ID командой /myid у бота."
          fi
          info=$(curl -sS "$api/getWebhookInfo" | jq -c '.result | {url, pending_update_count, last_error_message}')
          echo "Вебхук: $info"
          { echo; echo "Telegram-бот: https://t.me/$bot"; echo; echo "Вебхук: \`$info\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Перенос данных
        if: inputs.import_data && env.TARGET == 'production'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          n=$(npx wrangler d1 execute "$DB_NAME" --remote --json --command "SELECT COUNT(*) AS n FROM users" | jq -r '.[0].results[0].n')
          if [ "$n" != "0" ]; then
            echo "::warning::В D1 уже есть пользователи ($n) — перенос пропущен, чтобы ничего не задвоить."
            exit 0
          fi
          python3 -m pip install -q sqlalchemy psycopg2-binary
          python3 migrate/export_to_d1.py migrate/dump.sql
          npx wrangler d1 execute "$DB_NAME" --remote --yes --file=migrate/dump.sql
          rm -f migrate/dump.sql

      - name: Проверка
        run: |
          url="${{ steps.subdomain.outputs.url }}"
          counts=$(npx wrangler d1 execute "$DB_NAME" --remote $ENV_ARGS --json --command \
            "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM expenses) AS expenses, (SELECT COUNT(*) FROM friendships) AS friendships, (SELECT COUNT(*) FROM avatars) AS avatars, (SELECT COUNT(*) FROM api_tokens) AS tokens" \
            | jq -c '.[0].results[0]')
          echo "В D1: $counts"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/login" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          {
            echo "## Сайт: $url"
            echo
            echo "Страница входа отвечает: $code"
            echo
            echo "Данные в D1: \`$counts\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "::error::$url/login ответил $code"; exit 1; }

          # Демо-версия: заходим в демо-аккаунт и проверяем сканер с настоящими внешними сервисами
          if [ "$TARGET" = "preview" ]; then
            jar=$(mktemp)
            # Кэш товаров в демо-базе сбрасываем, чтобы проверка шла по свежему ответу Open Food Facts
            npx wrangler d1 execute "$DB_NAME" --remote $ENV_ARGS --command "DELETE FROM products" > /dev/null
            curl -s -c "$jar" -o /dev/null -X POST "$url/demo"
            dash=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$url/dashboard")
            wasm=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$url/vendor/zxing_reader.wasm")
            product=$(curl -s -b "$jar" "$url/api/product/5449000000996" | jq -c '{found: .product.found, name: .product.name, brand: .product.brand, image: (.product.image != null), price_stores: [.prices.stores[] | "\(.store) \(.avg)"]}')
            stores=$(curl -s -b "$jar" "$url/api/stores?lat=55.7646&lon=37.6050" | jq -c '{stores: [.stores[] | "\(.name) \(.distance) м"], error}')
            # Для сравнения — тот же запрос к зеркалам OpenStreetMap напрямую с машины GitHub
            direct=""
            for m in maps.mail.ru/osm/tools/overpass overpass.private.coffee overpass-api.de overpass.kumi.systems; do
              r=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST "https://$m/api/interpreter" \
                --data-urlencode 'data=[out:json][timeout:10];nwr(around:300,55.765,37.605)["shop"]["name"];out center 5;' || true)
              direct="$direct ${m%%/*}=$r"
            done
            nom=$(curl -s -m 15 -A 'SpendTracker/1.0 (github.com/danielka228/expense-tracker)' \
              'https://nominatim.openstreetmap.org/search?q=supermarket&viewbox=37.5996,55.7676,37.6104,55.7616&bounded=1&format=jsonv2&limit=5&accept-language=ru' | jq -c '[.[].name]' || true)
            direct="$direct | nominatim: $nom"
            echo "Overpass напрямую с GitHub: $direct"
            echo "Главная демо: $dash | распознаватель: $wasm"
            echo "Товар по штрих-коду Coca-Cola: $product"
            echo "Магазины рядом с Тверской, 12: $stores"
            {
              echo
              echo "### Проверка демо-версии"
              echo "- Главная в демо-аккаунте: $dash"
              echo "- Распознаватель штрих-кодов: $wasm"
              echo "- Товар 5449000000996: \`$product\`"
              echo "- Магазины рядом (Тверская): \`$stores\`"
              echo "- OpenStreetMap напрямую: $direct"
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$dash" = "200" ] || { echo "::error::Демо-главная ответила $dash"; exit 1; }
          fi
