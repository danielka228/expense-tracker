{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block container_class %}center-wrap{% endblock %}
{% block content %}
<div class="brand">💸 СпендТрекер</div>
<div class="card">
  <h2>Регистрация</h2>
  <form method="POST">
    <label>Логин</label>
    <input type="text" name="username" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" required>
    <button type="submit">Создать аккаунт</button>
  </form>
</div>
<div class="footer-link">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></div>
{% endblock %}
